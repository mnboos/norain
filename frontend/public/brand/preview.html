<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brisavia brand assets</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:48px;background:#e6ebf1;color:#1b365d;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto}h1{font-size:32px;margin:0 0 8px}p{color:#56677d;margin:0 0 28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border-radius:16px;padding:28px;min-width:0}h2{font-size:14px;font-weight:500;margin:0 0 24px;color:#6c7e92}.wide{grid-column:1/-1}.logo{width:100%;max-width:490px}.dark{background:#1b365d}.dark h2{color:#c8d5e5}.icons{display:flex;align-items:center;gap:28px}.icons img{border-radius:18%}.sizes{display:flex;align-items:center;gap:30px;height:72px}.caption{display:block;font-size:12px;color:#687b93;margin-top:12px}.header{display:flex;align-items:center;gap:10px;padding:12px;background:linear-gradient(90deg,#1b365d,#2d5a8e);color:white;border-radius:6px;font-size:16px;font-weight:bold}.header img{border-radius:7px}@media(max-width:600px){body{padding:20px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style><main><h1>Brisavia</h1><p>Road, wind and sun. Your existing navy and blue website palette.</p><div class="grid">
<section class="card wide"><h2>Primary logo · light background</h2><img class="logo" src="logo.svg" alt="Brisavia"></section>
<section class="card dark wide"><h2>Reversed logo · dark background</h2><img class="logo" src="logo-light.svg" alt="Brisavia"></section>
<section class="card"><h2>App and home-screen icons</h2><div class="icons"><img src="icon-192.png" width="120" height="120" alt="App icon"><img src="icon-maskable-512.png" width="120" height="120" style="border-radius:50%" alt="Circular mask preview"></div></section>
<section class="card"><h2>Browser icons · actual sizes</h2><div class="sizes"><div><img src="favicon-16.png" width="16" height="16" alt="16 pixel icon"><span class="caption">16 px</span></div><div><img src="favicon-32.png" width="32" height="32" alt="32 pixel icon"><span class="caption">32 px</span></div><div><img src="icon-192.png" width="48" height="48" alt="48 pixel icon"><span class="caption">48 px</span></div></div></section>
<section class="card wide"><h2>Website header preview</h2><div class="header"><img src="icon-192.png" width="32" height="32" alt="">Brisavia</div></section>
</div></main></html>
