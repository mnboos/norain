x-healthy: &healthy
  condition: service_healthy

# Shared by every service built from BACKEND_IMAGE. `<<:` merges shallowly: a service that
# sets environment/depends_on/networks itself REPLACES these, so re-include what it needs.
x-app: &app
  extends:
    service: backend
    file: docker-compose.base.yml
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
  build:
    args:
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  restart: unless-stopped
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379
  depends_on: &app-deps
    db: *healthy
    redis: *healthy
  networks:
    - internal
    # Workers need outbound access to weather providers and SMTP.
    - egress

# App deps + graphhopper, for everything that routes.
x-routing-deps: &routing-deps
  <<: *app-deps
  graphhopper: *healthy

# Allow time for Photon to load its prepared index.
x-slow-start: &slow-start
  interval: 30s
  timeout: 10s
  retries: 10
  start_period: 10m

services:
  caddy:
    container_name: caddy
    extends:
      service: caddy
      file: docker-compose.base.yml
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set}
    # Sentry, from .env at build time: vite bakes the DSN into the bundle, so a change needs a
    # rebuild. With a token the build uploads source maps to Sentry; none ends up in the image.
    build:
      args:
        SENTRY_DSN_FRONTEND: ${SENTRY_DSN_FRONTEND:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT_FRONTEND: ${SENTRY_PROJECT_FRONTEND:-}
      secrets:
        - sentry_auth_token
    restart: unless-stopped
    depends_on:
      backend: *healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:?DJANGO_ADMIN_PATH must be set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/caddy/data:/data
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/caddy/config:/config
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/django/static:/app/static:ro
    networks:
      - edge

  backend:
    <<: *app
    container_name: backend
    command: daphne -b 0.0.0.0 -p 8000 backend.asgi:application
    depends_on:
      <<: *routing-deps
      photon: *healthy
    volumes:
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/django/static:/app/backend/static
    healthcheck:
      test: [ "CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(), 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - edge
      - internal

  # The replicated workers have no container_name: Docker does not allow one with replicas.
  worker-cells:
    <<: *app
    command: python manage.py db_worker --queue-name cells
    deploy:
      replicas: 4

  worker-compute:
    <<: *app
    command: python manage.py db_worker --queue-name compute
    deploy:
      replicas: 2

  worker-forecasts:
    <<: *app
    command: python manage.py db_worker --queue-name forecasts
    deploy:
      replicas: 2
    depends_on: *routing-deps

  worker-default:
    <<: *app
    container_name: worker-default
    command: python manage.py db_worker --queue-name default
    depends_on: *routing-deps
    volumes:
      # The POI file from `osm-extract-pois.sh`, for `manage.py import_pois /osm_data/pois-<extract>.geojsonseq`.
      - ${ROUTING_OSM_IMPORT_DIR:?ROUTING_OSM_IMPORT_DIR must be set}:/osm_data:ro

  redis:
    container_name: redis
    extends:
      file: docker-compose.base.yml
      service: redis
    volumes:
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/redis:/data
    networks:
      - internal

  scheduler:
    <<: *app
    container_name: scheduler
    command: python manage.py run_forecast_scheduler

  db:
    container_name: db
    extends:
      service: db
      file: docker-compose.base.yml
    # postgis/postgis publishes no arm64 image; ARM VPS hosts need amd64 emulation.
    platform: linux/amd64
    volumes:
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  graphhopper:
    container_name: graphhopper
    extends:
      service: graphhopper
      file: docker-compose.base.yml
    image: ${GRAPHHOPPER_IMAGE:?GRAPHHOPPER_IMAGE must be set}
    volumes:
      # The folder GraphHopper imports from (ROUTING_OSM_IMPORT_DIR): the filtered file, a downloaded
      # extract and the elevation tiles, kept so a rebuild does not download them again.
      - ${ROUTING_OSM_IMPORT_DIR:?ROUTING_OSM_IMPORT_DIR must be set}:/osm_data
      # The built graph. Never built on start: just build-graphhopper-graph-from FILE builds it.
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/graphhopper/cache:/graph-cache
    healthcheck:
      # A stored graph loads in minutes; the service never builds one on start. Checks that fail
      # during start_period do not count; everything that waits on graphhopper (and release.sh)
      # waits with it.
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15m
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:8989/info" ]
    networks:
      - internal
      # Building the graph (just build-graphhopper-graph-from) downloads the OSM extract and the elevation tiles.
      - egress

  photon:
    container_name: photon
    extends:
      service: photon
      file: docker-compose.base.yml
    image: ${PHOTON_IMAGE:?PHOTON_IMAGE must be set}
    environment:
      # Import a local artifact explicitly before startup; this network has no Internet access.
      PHOTON_ALLOW_DOWNLOAD: "false"
    volumes:
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/photon:/photon_data
    healthcheck:
      <<: *slow-start
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:2322/api?q=Zurich" ]
    networks:
      - internal

networks:
  egress:
  edge:
  internal:
    internal: true

# Here, not in docker-compose.base.yml: `extends` does not carry top-level secrets over.
secrets:
  sentry_auth_token:
    # A BuildKit secret, so the token stays out of the image and its build history.
    environment: SENTRY_AUTH_TOKEN
