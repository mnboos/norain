x-healthy: &healthy
  condition: service_healthy

# Shared by every service built from BACKEND_IMAGE. `<<:` merges shallowly: a service that
# sets environment/depends_on/networks itself REPLACES these, so re-include what it needs.
x-app: &app
  extends:
    service: backend
    file: docker-compose.base.yml
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
  restart: unless-stopped
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379
  depends_on: &app-deps
    db: *healthy
    redis: *healthy
  networks:
    - internal

# App deps + graphhopper, for everything that routes.
x-routing-deps: &routing-deps
  <<: *app-deps
  graphhopper: *healthy

# Photon downloads and imports its data on first boot.
x-slow-start: &slow-start
  interval: 30s
  timeout: 10s
  retries: 10
  start_period: 10m

services:
  caddy:
    extends:
      service: caddy
      file: docker-compose.base.yml
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set}
    restart: unless-stopped
    depends_on:
      backend: *healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/caddy/data:/data
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/caddy/config:/config
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/django/static:/app/static:ro
    networks:
      - edge

  backend:
    <<: *app
    command: daphne -b 0.0.0.0 -p 8000 backend.asgi:application
    depends_on:
      <<: *routing-deps
      photon: *healthy
    volumes:
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/django/static:/app/static
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - edge
      - internal

  worker-cells:
    <<: *app
    command: python manage.py db_worker --queue-name cells
    deploy:
      replicas: 4

  worker-forecasts:
    <<: *app
    command: python manage.py db_worker --queue-name forecasts
    deploy:
      replicas: 2
    depends_on: *routing-deps

  worker-default:
    <<: *app
    command: python manage.py db_worker --queue-name default
    depends_on: *routing-deps

  redis:
    extends:
      file: docker-compose.base.yml
      service: redis
    volumes:
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/redis:/data
    networks:
      - internal

  scheduler:
    <<: *app
    command: python manage.py run_forecast_scheduler

  db:
    extends:
      service: db
      file: docker-compose.base.yml
    # postgis/postgis publishes no arm64 image; ARM VPS hosts need amd64 emulation.
    platform: linux/amd64
    volumes:
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  graphhopper:
    extends:
      service: graphhopper
      file: docker-compose.base.yml
    image: ${GRAPHHOPPER_IMAGE:?GRAPHHOPPER_IMAGE must be set}
    environment:
      # The VPS only serves: the graph is imported elsewhere and copied into graphhopper/cache
      # (docs/how-to/build-routing-graph.md). An empty cache fails fast instead of importing.
      GRAPHHOPPER_ALLOW_IMPORT: "false"
    volumes:
      # Unused while serving; mapped so the base file's relative ./data path is not used.
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/graphhopper/osm:/osm_data
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/graphhopper/cache:/graph-cache
    healthcheck:
      # Loading a prebuilt graph takes seconds to a few minutes, not an import's hours.
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 3m
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:8989/info" ]
    networks:
      - internal

  photon:
    extends:
      service: photon
      file: docker-compose.base.yml
    image: ${PHOTON_IMAGE:?PHOTON_IMAGE must be set}
    environment:
      PHOTON_INDEX_URL: ${PHOTON_INDEX_URL:?PHOTON_INDEX_URL must be set}
    volumes:
      - ${APP_STORAGE_PATH:?APP_STORAGE_PATH must be set}/photon:/photon_data
    healthcheck:
      <<: *slow-start
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:2322/api?q=Zurich" ]
    networks:
      - internal

networks:
  edge:
  internal:
    internal: true
