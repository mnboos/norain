services:

  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    command: -c config_file=/etc/postgresql/postgresql.conf
    shm_size: 4gb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_DB=${DB_NAME:?err}
      - POSTGRES_USER=${DB_USER:?err}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?err}
      - TZ=${TZ}
    container_name: db
    volumes:
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
      - ${APP_STORAGE_PATH:?err}/db/app/data:/var/lib/postgresql/data
  motis:
    image: ghcr.io/motis-project/motis:master
    container_name: motis
    command: ["./motis", "server"]
    volumes:
      - ./data/motis/config.yml:/config.yml:ro
      - ./data/motis/data:/data
    restart: unless-stopped

  graphhopper:
    build:
        context: .
        dockerfile: docker/graphhopper.Dockerfile
    container_name: graphhopper
    deploy:
        resources:
            limits:
                memory: 8g
    memswap_limit: 8g

    volumes:
        - ./data/graphhopper/osm:/osm_data
        - ./data/graphhopper/cache:/graph-cache
        - ./data/graphhopper/graphhopper-config.yaml:/config.yaml:ro
        - ./data/graphhopper/models:/custom_models
    environment:
        - OSM_DATA_DIR=/osm_data
        # Coverage area: any Geofabrik .osm.pbf (country/continent/planet). See .env.
        - OSM_DATA_URL=${OSM_DATA_URL:-https://download.geofabrik.de/europe/switzerland-latest.osm.pbf}
        # JVM heap; raise for larger extracts (e.g. 16g for a continent, more for planet).
        - GRAPHHOPPER_HEAP=${GRAPHHOPPER_HEAP:-6g}
    restart: unless-stopped

  photon:
    build:
      context: .
      dockerfile: docker/photon.Dockerfile
    container_name: photon
    environment:
        # Photon dump/index matching OSM_DATA_URL's area. See .env. A *.jsonl.zst URL is imported,
        # a *.tar.bz2 URL is extracted. Default: Switzerland+Liechtenstein JSONL dump.
        - PHOTON_INDEX_URL=${PHOTON_INDEX_URL:-https://download1.graphhopper.com/public/europe/switzerland-liechtenstein/photon-dump-switzerland-liechtenstein-1.0-latest.jsonl.zst}
        - PHOTON_IMPORT_HEAP=${PHOTON_IMPORT_HEAP:-4g}
    volumes:
      - ./data/photon:/photon_data # Persist photon's data
#    command: ["-osm-pbf", "/data/switzerland-latest.osm.pbf", "-country-codes", "CH", "-languages", "de,fr,it,en"]
    restart: unless-stopped

