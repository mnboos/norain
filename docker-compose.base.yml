services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend

  caddy:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend

  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    command: -c config_file=/etc/postgresql/postgresql.conf
    shm_size: 4gb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_DB=${DB_NAME:?err}
      - POSTGRES_USER=${DB_USER:?err}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?err}
      - TZ=${TZ}
    container_name: db
    volumes:
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:z
      - ${APP_STORAGE_PATH:?err}/db:/var/lib/postgresql:z

  graphhopper:
    build:
      context: .
      dockerfile: Dockerfile
      target: graphhopper
    container_name: graphhopper
    deploy:
      resources:
        limits:
          memory: ${GRAPHHOPPER_MEM_LIMIT:-8g}
    memswap_limit: ${GRAPHHOPPER_MEM_LIMIT:-8g}

    volumes:
      - ./data/graphhopper/osm:/osm_data:z
      - ./data/graphhopper/cache:/graph-cache:z
      - ./data/graphhopper/graphhopper-config.yaml:/config.yaml:ro,z
      - ./data/graphhopper/models:/custom_models:z
    environment:
      - OSM_DATA_DIR=/osm_data
      # Coverage area: any Geofabrik .osm.pbf (country/continent/planet). See .env.
      - OSM_DATA_URL=${OSM_DATA_URL:-https://download.geofabrik.de/europe/switzerland-latest.osm.pbf}
      # Serving JVM heap (maximum). With MMAP a few GB are enough; with RAM_STORE it must hold the whole graph.
      - GRAPHHOPPER_HEAP=${GRAPHHOPPER_HEAP:-6g}
      # Heap for building the graph, when this container builds it; defaults to GRAPHHOPPER_HEAP.
      - GRAPHHOPPER_BUILD_HEAP=${GRAPHHOPPER_BUILD_HEAP:-}
      # How the build holds the graph: RAM_STORE (in the heap) or MMAP (in files, far smaller heap, slower).
      - GRAPHHOPPER_BUILD_DATAACCESS=${GRAPHHOPPER_BUILD_DATAACCESS:-RAM_STORE}
      # MMAP (graph paged in from disk by the OS, small heap) or RAM_STORE (whole graph in the heap).
      - GRAPHHOPPER_DATAACCESS=${GRAPHHOPPER_DATAACCESS:-MMAP}
      # true: build the graph from OSM_DATA_URL when /graph-cache is empty. false: fail instead,
      # for a graph built elsewhere and copied in. See the entrypoint.
      - GRAPHHOPPER_BUILD_GRAPH=${GRAPHHOPPER_BUILD_GRAPH:-true}
      # true: build the graph and exit, e.g. to copy it to another machine.
      - GRAPHHOPPER_BUILD_ONLY=${GRAPHHOPPER_BUILD_ONLY:-false}
    restart: unless-stopped

  photon:
    build:
      context: .
      dockerfile: Dockerfile
      target: photon
    container_name: photon
    environment:
      # Photon dump/index matching OSM_DATA_URL's area. See .env. A *.jsonl.zst URL is imported,
      # a *.tar.bz2 URL is extracted. Default: Switzerland+Liechtenstein JSONL dump.
      - PHOTON_INDEX_URL=${PHOTON_INDEX_URL:-https://download1.graphhopper.com/public/europe/switzerland-liechtenstein/photon-dump-switzerland-liechtenstein-1.0-latest.jsonl.zst}
      - PHOTON_IMPORT_HEAP=${PHOTON_IMPORT_HEAP:-4g}
    volumes:
      - ./data/photon:/photon_data:z # Persist photon's data
    #    command: ["-osm-pbf", "/data/switzerland-latest.osm.pbf", "-country-codes", "CH", "-languages", "de,fr,it,en"]
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: redis
    environment:
      - REDIS_ARGS=--appendonly yes
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
