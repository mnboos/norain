services:
  graphhopper:
    extends:
      service: graphhopper
      file: docker-compose.base.yml
    ports:
      - "${GRAPHHOPPER_PORT:-8989}:8989"

  photon:
    extends:
      service: photon
      file: docker-compose.base.yml
    command: -cors-any
    ports:
      - "${PHOTON_PORT:-2322}:2322" # Photon runs on port 2322

  db:
    extends:
      service: db
      file: docker-compose.base.yml
    # postgis/postgis publishes no arm64 image; Apple Silicon runs this one emulated.
    platform: linux/amd64
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Named volume, not a bind mount: initdb must chmod its data dir, which a
      # Windows-host bind mount (/mnt/c) refuses with "Operation not permitted".
      - db-data:/var/lib/postgresql
  redis:
    extends:
      service: redis
      file: docker-compose.base.yml
    ports:
      - "${REDIS_PORT:-6379}:6379"
volumes:
  db-data:
